<section class="home-story-section feedback-section">
  <div class="story-inner">
    <div class="story-heading"><span class="eyebrow">{{ home_settings.feedback_eyebrow }}</span><h2>{{ home_settings.feedback_title }}</h2></div>
    <div class="feedback-grid">
      {% for feedback in home_feedback %}
        <article class="feedback-card"><span class="quote-mark" aria-hidden="true">“</span><blockquote>{{ feedback.quote }}</blockquote><div class="feedback-author"><span class="feedback-avatar">{{ feedback.display_name|first|upper }}</span><div><strong>{{ feedback.display_name }}</strong><span>{{ feedback.get_role_display }}</span></div></div></article>
      {% empty %}<article class="story-empty">{{ home_settings.feedback_empty_text }}</article>{% endfor %}
    </div>
  </div>
</section>

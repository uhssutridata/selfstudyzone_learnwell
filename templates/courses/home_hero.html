<section class="hero hero-{{ home_settings.layout }}">
  <div class="hero-copy">
    <span class="eyebrow">{{ home_settings.hero_eyebrow }}</span>
    <h1>{{ home_settings.hero_title }}<br><em>{{ home_settings.hero_highlight }}</em></h1>
    <p>{{ home_settings.hero_description }}</p>
    <form class="search" method="get">
      <input name="q" value="{{ query }}" placeholder="{{ home_settings.search_placeholder }}" aria-label="{{ home_settings.search_placeholder }}">
      <button class="button">{{ home_settings.search_button }} <span>→</span></button>
    </form>
  </div>
  <div class="hero-math-visual">
    <svg class="fresh-math-svg" viewBox="0 0 520 390" role="img" aria-labelledby="fresh-math-title fresh-math-description">
      <title id="fresh-math-title">An animated exponential graph</title>
      <desc id="fresh-math-description">An exponential curve draws across coordinate axes as a highlighted point moves upward along the curve.</desc>
      <defs>
        <linearGradient id="math-panel-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef2e7"/><stop offset="1" stop-color="#dce7d3"/></linearGradient>
        <linearGradient id="math-curve-gradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#91a982"/><stop offset=".5" stop-color="#496d50"/><stop offset="1" stop-color="#c0956e"/></linearGradient>
        <filter id="math-point-glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect class="math-panel" x="12" y="12" width="496" height="366" rx="28" fill="url(#math-panel-gradient)"/>
      <circle class="math-orbit-halo" cx="426" cy="84" r="42" fill="#fff" opacity=".34"/>
      <g class="math-floating-symbol symbol-pi"><text x="426" y="95">π</text></g>
      <g class="math-floating-symbol symbol-sigma"><text x="80" y="91">Σ</text></g>
      <g class="math-floating-symbol symbol-root"><text x="431" y="315">√x</text></g>
      <rect x="62" y="73" width="396" height="252" rx="18" fill="#fff" opacity=".82"/>
      <g class="math-grid-lines" stroke="#dfe6d9" stroke-width="1">
        <path d="M112 94v206M162 94v206M212 94v206M262 94v206M312 94v206M362 94v206M412 94v206M88 118h344M88 158h344M88 198h344M88 238h344M88 278h344"/>
      </g>
      <path d="M88 278H432M132 300V96" fill="none" stroke="#637c5c" stroke-width="2.5" stroke-linecap="round"/>
      <path class="math-axis-arrow" d="m432 278-8-5v10zM132 96l-5 8h10z" fill="#637c5c"/>
      <text class="math-axis-label" x="421" y="300">x</text><text class="math-axis-label" x="114" y="107">y</text>
      <path class="math-exponential-curve" d="M132 260 C178 254 220 244 260 222 C308 196 350 145 388 102" fill="none" stroke="url(#math-curve-gradient)" stroke-width="6" stroke-linecap="round"/>
      <path d="M132 260V278" stroke="#c5966d" stroke-width="1.5" stroke-dasharray="4 6" opacity=".65"/>
      <circle cx="132" cy="260" r="7" fill="#fff" stroke="#52734f" stroke-width="3"/>
      <text class="math-vertex-label" x="143" y="257">(0, 1)</text>
      <circle class="math-moving-point-halo" cx="132" cy="260" r="12" fill="#d3a16f" opacity=".22"><animateMotion dur="5s" repeatCount="indefinite" path="M0 0 C46 -6 88 -16 128 -38 C176 -64 218 -115 256 -158"/></circle>
      <circle class="math-moving-point" cx="132" cy="260" r="7" fill="#cb9569" stroke="#fff" stroke-width="3" filter="url(#math-point-glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M0 0 C46 -6 88 -16 128 -38 C176 -64 218 -115 256 -158"/></circle>
      <rect class="math-formula-card" x="300" y="31" width="105" height="42" rx="12" fill="#fff"/>
      <text class="math-formula" x="352" y="58" text-anchor="middle">y = eˣ</text>
      <text class="math-small-note" x="260" y="355" text-anchor="middle">Exponential growth, traced point by point.</text>
    </svg>
  </div>
</section>

<section class="hero hero-{{ home_settings.layout }}">
  <div class="hero-copy">
    <div class="hero-eyebrow-row"><span class="eyebrow">{{ home_settings.hero_eyebrow }}</span><svg class="math-hero-svg" viewBox="0 0 140 68" role="img" aria-label="Animated mathematical symbols orbiting a formula"><ellipse class="math-orbit-ring" cx="70" cy="34" rx="36" ry="19"/><circle class="math-center" cx="70" cy="34" r="14"/><text class="math-center-symbol" x="70" y="39" text-anchor="middle">π</text><g class="math-orbiting-points"><circle cx="34" cy="34" r="4"/><circle cx="106" cy="34" r="3"/></g><text class="math-symbol math-sigma" x="17" y="20">Σ</text><text class="math-symbol math-root" x="112" y="56">√x</text><text class="math-symbol math-square" x="57" y="8">x²</text></svg></div>
    <h1>{{ home_settings.hero_title }}<br><em>{{ home_settings.hero_highlight }}</em></h1>
    <p>{{ home_settings.hero_description }}</p>
    <form class="search" method="get">
      <input name="q" value="{{ query }}" placeholder="{{ home_settings.search_placeholder }}" aria-label="{{ home_settings.search_placeholder }}">
      <button class="button">{{ home_settings.search_button }} <span>→</span></button>
    </form>
  </div>
  {% include 'courses/home_content_cards.html' %}
</section>
